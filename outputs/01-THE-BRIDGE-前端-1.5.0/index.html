.site-help{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);padding-block:72px;border-top:1px solid #dce5ef}.site-help h2{font-size:28px;margin:0 0 16px}.site-help>div>p,.release-notes>p{margin-bottom:20px}.release-notes details{border-bottom:1px solid #dce5ef;padding:16px 0}.release-notes summary{display:flex;justify-content:space-between;gap:16px;cursor:pointer;min-height:44px;align-items:center}.release-notes summary span{font-weight:700}.release-notes time{font-size:14px;font-variant-numeric:tabular-nums}.release-notes h3{font-size:18px;margin:12px 0}.release-notes ul{padding-left:20px;line-height:1.8}.release-notes li{margin-bottom:8px}.letter-detail-heading{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}.letter-retention{margin:16px 0;color:#456181;font-size:15px}.site-help summary:focus-visible{outline:2px solid #3266a8;outline-offset:4px}@media(max-width:760px){.site-help{grid-template-columns:1fr;padding-block:44px;gap:40px}.site-help h2{font-size:25px}}
/* Moderation extends the existing workspace: quiet lists, clear comparisons, shared tokens. */
.workflow-note{margin-bottom:28px;padding:18px 22px;background:var(--paler);color:var(--muted);line-height:1.8}.workflow-note a{text-decoration:underline;color:var(--accent)}
.poll-refresh{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 0 28px}.poll-refresh .button{flex-shrink:0}
.reviews-panel>.panel-heading{align-items:flex-start}.reviews-panel>.panel-heading>.text-button{white-space:nowrap;flex-shrink:0;min-width:44px}.reviews-panel>.panel-heading .field-note{margin-top:12px;max-width:68ch}.review-filters{display:flex;flex-wrap:wrap;margin-bottom:28px;width:fit-content}
.review-list{border-top:1px solid var(--line)}.review-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:24px;padding:28px 20px;text-align:left;border-bottom:1px solid var(--line);transition:background-color .18s}.review-row:hover{background:var(--paler)}.review-row h3{font-size:23px;margin:8px 0 12px}.review-row p{color:var(--muted);font-size:14px;line-height:1.8}.review-row>.status{align-self:start}.review-row>svg{align-self:center;color:var(--accent)}
.review-state-pending{background:var(--pale);color:var(--accent-strong)}.review-state-rejected{background:var(--error-bg);color:var(--error)}.review-state-approved{background:var(--success-bg);color:var(--success)}.review-state-withdrawn,.review-state-draft{background:var(--canvas);color:var(--muted)}
.review-back{margin:0 0 24px}.review-detail>header{padding-bottom:30px;border-bottom:1px solid var(--line)}.review-status-line{display:flex;flex-wrap:wrap;align-items:center;gap:14px;color:var(--muted);font-size:14px}.review-detail>header>h3{font-size:32px;margin:22px 0 26px}.review-metadata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 30px;margin:0}.review-metadata div,.review-poll-meta div{min-width:0}.review-metadata dt,.review-poll-meta dt{color:var(--muted);font-size:14px;margin-bottom:5px}.review-metadata dd,.review-poll-meta dd{margin:0;overflow-wrap:anywhere}.review-reason{margin-top:26px;padding:20px;background:var(--paler)}.review-reason p{margin-top:8px}
.review-comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:32px 0;gap:40px}.review-comparison>section{min-width:0}.review-comparison>section+section{border-left:1px solid var(--line);padding-left:40px}.review-comparison h3{font-size:18px;color:var(--muted);margin-bottom:24px}.review-comparison h4{font-size:25px;margin-bottom:18px}.review-rich-content{margin-top:24px;overflow-wrap:anywhere}.review-empty-version{color:var(--muted);padding-block:12px}.review-poll-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:24px 0}.review-options{padding-left:24px;margin:24px 0}.review-options li{padding:14px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.review-options img{max-height:180px;max-width:100%;object-fit:contain;margin-bottom:12px}.review-actions{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.review-reject-form{max-width:720px;margin:24px 0}.review-editor{grid-template-columns:minmax(0,880px);justify-content:center}
.system-release{border-top:1px solid var(--line);padding:24px 0}.system-release:last-child{border-bottom:1px solid var(--line)}.system-release summary{cursor:pointer;min-height:44px;line-height:1.8}.system-release summary strong{font-size:20px}.system-release summary time{margin-left:24px;font-size:14px;color:var(--muted)}.system-release-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 48px;padding:28px 0 8px}.system-release-sections h3{font-size:18px;margin-bottom:14px}.system-release-sections ul{padding-left:22px;margin:0}.system-release-sections li{margin-bottom:8px;overflow-wrap:anywhere}
@media(max-width:760px){.review-row{gap:12px;padding:24px 4px;grid-template-columns:minmax(0,1fr) auto}.review-row>svg{display:none}.review-row h3{font-size:20px}.review-metadata,.review-poll-meta{grid-template-columns:1fr}.review-detail>header>h3{font-size:27px}.review-comparison{grid-template-columns:1fr;gap:32px}.review-comparison>section+section{border-left:0;border-top:1px solid var(--line);padding:28px 0 0}.review-filters{width:100%}.review-filters button{flex:1 0 28%;min-height:44px}.poll-refresh{align-items:flex-start;gap:16px}.poll-refresh .field-note{font-size:13px}.poll-refresh .button{font-size:14px;padding:12px 16px}.system-release-sections{grid-template-columns:1fr;gap:24px}.system-release summary time{display:block;margin:8px 0 0 20px}.system-release summary strong{font-size:18px}.review-actions .button{width:100%}.workflow-note{padding:16px;font-size:14px}}
